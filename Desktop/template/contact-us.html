
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <header class="en-tete">
        <div class="conteneur en-tete-contenu">
            <a href="index.html" class="logo">Élan Fitness</a>
            <nav aria-label="Navigation principale">
                <ul class="menu">
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="a-propos.html">À propos</a></li>
                    <li><a href="programmes.html">Programmes</a></li>
                    <li><a href="contact-us.html" class="lien-actif">Contactez-nous</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="section">
            <div class="conteneur">
                <div class="titre">
                    <h1>Contactez-nous</h1>
                </div>
                <form class="formulaire">
                    <div>
                        <label for="nom">Nom</label>
                        <input type="text" id="nom" name="nom" placeholder="Entrez votre nom" required>
                    </div>
                    <div>
                        <label for="prenom">Prénom</label>
                        <input type="text" id="prenom" name="prenom"placeholder="Entrez votre prénom" required>
                    </div>
                    <div>
                        <label for="sujet">Sujet</label>
                        <input type="text" id="sujet" name="sujet"placeholder="Entrez votre sujet" required>
                    </div>
                    <div>
                        <label for="numero">Numéro</label>
                        <input type="tel" id="numero" name="numero"placeholder="Entrez votre numéro de téléphone" required>
                    </div>
                    <div>
                        <label for="email">Email</label>
                       <input type="email" id="email" name="email"placeholder="Entrez votre adresse mail" required>
                    </div>

                    <div>
                        <label for="message">Message</label>
                        <textarea id="message" name="message"placeholder="Écrivez votre message" required></textarea>
                    </div>
                    <button type="submit">Envoyer</button>
                </form>
            </div>
        </section>
    </main>
    <footer class="pied-de-page">
        <div class="conteneur">
            <div class="pied-haut">
                <div>
                    <p class="logo logo-clair">Élan Fitness</p>
                    <p class="slogan">Ton énergie, ton rythme.</p>
                </div>
                <nav aria-label="Navigation du pied de page">
                    <ul class="menu menu-pied">
                        <li><a href="index.html">Accueil</a></li>
                        <li><a href="a-propos.html">À propos</a></li>
                        <li><a href="programmes.html">Programmes</a></li>
                        <li><a href="contact-us.html">Contactez-nous</a></li>
                    </ul>
                </nav>
            </div>
            <div class="pied-bas">
                <p>Adresse : 12 rue des Palmiers, 20000 Casablanca</p>
                <p>&copy; 2026 Élan Fitness — Projet pédagogique fictif</p>
            </div>

        </div>

    </footer>

</body>
</html>
